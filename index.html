<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- cabecera de documento para abrir index.html desde el disco (sin ella: modo quirks y sin escala en móvil); al publicar el artefacto pone la suya -->
<style>[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Composiciones y Lords WH3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: pantalla de juego oscura; barra superior con migas, vistas apiladas (facción → personaje → árbol). Árbol en filas por categoría con scroll horizontal propio; panel de detalle a la derecha (abajo en móvil). Tema único oscuro a propósito, como la interfaz del juego. */
:root{
  --bg:#121010; --panel:#1d1915; --panel2:#26201a; --line:#4a3d2c; --gold:#c9a45c; --gold2:#e8cf8f; --silver:#b9c0c8;
  --text:#e6dccb; --muted:#a39580; --good:#8fd16a; --bad:#e2665a; --char:#FFB62F; --battle:#F1413D; --camp:#43DDF8;
  --display:"IM Fell English SC","Palatino Linotype",Georgia,serif; --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);
  background-image:radial-gradient(ellipse at 50% -20%,#2b2117 0,transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(#241d16,#1a1511);border-bottom:1px solid var(--line);box-shadow:0 2px 0 #0008}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{font:22px/1 var(--display);color:var(--gold2);letter-spacing:.02em;white-space:nowrap}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;min-width:0}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumbs span.sep{opacity:.5}
.patch{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
main{padding-block:18px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--gold2);text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:17px}
.frame{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2px #3a2f22;border-radius:3px}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* ---- facciones ---- */
.search{display:flex;gap:10px;align-items:center;margin:12px 0 18px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;background:#0d0b09;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:2px;font:inherit}
.race{margin-bottom:22px}
.race>h2{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:20px}
.race>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;cursor:pointer;border:1px solid var(--line);background:linear-gradient(180deg,#2a221b,#1c1814);border-radius:3px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--gold);transform:translateY(-1px)}
.card .t{min-width:0}
.card .n{font-family:var(--display);font-size:17px;color:var(--gold2);line-height:1.15}
.card .s{font-size:13px;color:var(--muted)}
.crest{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:20px var(--display);color:#fff;border:2px solid var(--gold);box-shadow:0 0 0 2px #000,inset 0 0 10px #0009;text-shadow:0 1px 2px #000}
img.crest{width:54px;height:54px;border:0;border-radius:0;box-shadow:none;object-fit:contain;filter:drop-shadow(0 2px 3px #000b)}
img.crest.face{width:42px;height:91px;border:2px solid var(--silver);border-radius:3px;box-shadow:0 0 0 1px #000;object-fit:cover;filter:none;background:#000}
img.crest.face.leg,.portrait img.crest.full.leg{border-color:var(--gold2);box-shadow:0 0 0 2px #000,0 0 8px #c9a45c99}
.crest.com{border-color:var(--silver)}

/* ---- personajes ---- */
.fhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;padding:16px;margin-bottom:16px}
.fhead .crest{width:64px;height:64px;font-size:28px}
.fx-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
.fxbox h3{margin-bottom:6px}
ul.fx{list-style:none;margin:0;padding:0;display:grid;gap:3px}
ul.fx li{font-size:14px;padding-left:14px;position:relative}
ul.fx li::before{content:"◆";position:absolute;left:0;top:1px;font-size:9px;color:var(--gold)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.scope{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin:6px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:1px solid transparent;border-bottom:0;padding:8px 16px;cursor:pointer;font:18px var(--display);color:var(--muted);border-radius:3px 3px 0 0}
.tabs button[aria-selected="true"]{color:var(--gold2);border-color:var(--line);background:var(--panel2);margin-bottom:-1px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;border:1px solid var(--line);color:var(--muted)}
.tag.leg{color:#1a1208;background:var(--gold);border-color:var(--gold2)}
.tag.conf{color:#cfe3f0;border-color:#4d7894;background:#1c2c38}
.grp{display:grid;gap:8px;margin-bottom:18px}
.grp .note{margin:0;font-size:13px}

/* ---- árbol ---- */
.sim{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.simmain{display:grid;gap:14px;min-width:0}
.sheet{padding:14px;display:grid;gap:12px;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:auto;scrollbar-width:thin}
.portrait{display:flex;gap:12px;align-items:center}
.card.info{cursor:default;opacity:.8}.card.info:hover{transform:none}
.evo{display:grid;gap:6px}.evob{display:flex;gap:8px;align-items:center;text-align:left;background:#0d0b0966;border:1px solid var(--line);border-radius:3px;padding:4px 6px;color:inherit;font:inherit;cursor:pointer}
.evob:hover{border-color:var(--gold)}.evob small{color:var(--muted)}.evob img,.evob .crest{max-height:48px}
.portrait .crest{width:58px;height:58px;font-size:26px}
.portrait img.crest.full{width:72px;height:156px;border-radius:3px;object-fit:cover;border:2px solid var(--silver);box-shadow:0 0 0 2px #000;filter:none;background:#000}
.rankbox{display:grid;gap:6px;justify-items:center;text-align:center;padding:10px;border:1px solid var(--line);border-radius:3px;background:#0d0b0999}
.rankbox .lbl{color:var(--gold);font-size:13px}
.lvnum{display:flex;align-items:baseline;gap:6px;line-height:1}
.lvnum output{font:44px/1 var(--display);color:var(--gold2);text-shadow:0 0 12px #c9a45c66;font-variant-numeric:tabular-nums}
.lvnum span{font:18px var(--display);color:var(--muted)}
.rankbox .lvbar{width:100%;flex:none}
.rankrow{display:flex;align-items:center;gap:8px}
.lvbar{flex:1;height:8px;border-radius:4px;background:#0d0b09;border:1px solid var(--line);overflow:hidden}
.lvbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .15s}
.rankrow output{font:22px var(--display);color:var(--gold2);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lstats{display:grid;gap:6px}
.lsg{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.lsr{background:#0d0b0999;border:1px solid var(--line);border-radius:2px;padding:3px 6px;font-size:11px;color:var(--muted);min-width:0}
.lsr.ch{border-color:#4f6b3a}
.lsr span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsr span .sico{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.lsr b{font-size:14px;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.lsr b.up,.lsr small.up,.lsf.up{color:var(--good)} .lsr b.down,.lsr small.down{color:var(--bad)}
.lsr small{font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}
.lsr .brk{display:block;margin:0;color:var(--muted);font-weight:400}
.lsm{font-size:12px;color:var(--muted)} .lsm b{color:var(--gold2)}
.lsfs{display:flex;flex-wrap:wrap;gap:4px}.lsf{font-size:11px;border:1px solid var(--line);border-radius:2px;padding:2px 6px;color:var(--muted)}
.lsf .sico{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.lsn{font-size:11px;margin:0}
.pts div{background:#0d0b09;border:1px solid var(--line);padding:6px 8px;border-radius:2px}
.pts b{display:block;font:22px var(--display);color:var(--gold2);font-variant-numeric:tabular-nums}
.pts .over b{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{background:linear-gradient(#4a3a26,#2d2318);border:1px solid var(--gold);color:var(--gold2);padding:7px 12px;border-radius:2px;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.2)} .btn.ghost{background:none;border-color:var(--line);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.copied{font-size:13px;color:var(--good)}
.tlist{max-height:320px;overflow-y:auto;display:grid;gap:4px;margin-top:4px}
.topt{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.topt.on{border-color:var(--gold);background:var(--panel2)}
.topt input{margin-top:3px;accent-color:var(--gold)}
.topt ul.fx li{font-size:13px}
.bname{width:100%;min-width:0;background:#0d0b09;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:2px;font:inherit}
.armyuse{width:100%;margin-top:6px}
.linkbox{width:100%;font:12px ui-monospace,monospace;background:#0d0b09;color:var(--muted);border:1px solid var(--line);padding:6px;border-radius:2px}
.saved{display:grid;gap:4px;max-height:180px;overflow:auto}
.saved div{display:flex;gap:6px;align-items:center;font-size:13px}
.saved div button.l{flex:1;text-align:left;background:none;border:0;color:var(--gold);cursor:pointer;padding:2px 0;text-decoration:underline;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved div button.x{background:none;border:0;color:var(--muted);cursor:pointer}

/* ---- árbol con el aspecto del juego: placas, marcos, flechas e iconos sacados de ui.pack (ui_juego.js, iconos_hab.js) ---- */
.tree{padding:0;min-width:0;overflow:hidden;position:relative;--gfont:"Libre Caslon Text","Palatino Linotype",Georgia,serif;
  background:radial-gradient(ellipse 60% 70% at 20% 30%,#262a3a55,transparent 70%),radial-gradient(ellipse 50% 60% at 85% 75%,#2a2d3c44,transparent 70%),linear-gradient(180deg,#14151d,#0d0e14)}
.tbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid #2a2c38;background:#0b0c11cc;font-size:12px;color:var(--muted)}
.tbar .zoom{margin-left:auto;display:flex;align-items:center;gap:4px}
.tbar .zoom button{background:#1b1d27;border:1px solid #3a3d4e;color:var(--text);width:26px;height:24px;border-radius:2px;cursor:pointer;line-height:1}
.tbar .zoom output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.treescroll{overflow:auto;max-height:calc(100vh - 150px);padding:0;cursor:grab;user-select:none;-webkit-user-select:none}
.treescroll.dragging,.treescroll.dragging .sk{cursor:grabbing}
.gtree{position:relative;zoom:var(--z,1)}
.gbox{position:absolute;background:linear-gradient(180deg,#0f1420a8,#0b0f18c0);border:1px solid #3b5470;box-shadow:inset 0 0 0 1px #0008,inset 0 0 24px #0009,0 0 0 1px #0006;pointer-events:none}
.gbox.on{border-color:#4f7ba3}
.gbox .need{position:absolute;right:6px;top:3px;font:12px/1 var(--gfont);color:#9fb6cc;text-shadow:0 1px 2px #000}
.gbox.ok .need{color:#b9e87a}
svg.glinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rowlab{position:absolute;left:4px;width:22px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font:13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#8d8270;pointer-events:none;opacity:.85}
.sk{position:absolute;width:224px;height:67px;padding:0;border:0;background:none;cursor:pointer;color:#FFF8D7;--c:#FFB62F;font:inherit;text-align:left}
.sk:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
.sk .pl,.sk .orn{position:absolute;top:0;pointer-events:none}
.sk .pl{left:35px;width:185px;height:67px;background-color:var(--c);background-image:var(--t-plate);background-blend-mode:multiply;background-size:100% 100%;
  -webkit-mask:var(--t-plate) 0 0/100% 100%;mask:var(--t-plate) 0 0/100% 100%;transition:filter .12s}
.sk:hover .pl{background-image:var(--t-plate-hover);-webkit-mask-image:var(--t-plate-hover);mask-image:var(--t-plate-hover)}
.sk.taken .pl{background-image:var(--t-plate-sel);-webkit-mask-image:var(--t-plate-sel);mask-image:var(--t-plate-sel)}
.sk.taken:hover .pl{background-image:var(--t-plate-sel-hover);-webkit-mask-image:var(--t-plate-sel-hover);mask-image:var(--t-plate-sel-hover)}
.sk .orn{left:0;width:220px;height:67px;background:var(--t-orn) 0 0/100% 100% no-repeat}
.sk .ic{position:absolute;left:31px;top:-3px;width:72px;height:72px;pointer-events:none;filter:drop-shadow(0 2px 3px #000a)}
.sk .ic.pend{opacity:0}
.sk .nm{position:absolute;left:92px;width:118px;top:5px;height:57px;display:flex;align-items:center;justify-content:center;text-align:center;
  font:18px/1 var(--gfont);letter-spacing:-.01em;text-shadow:0 1px 2px #000,0 0 6px #000c;pointer-events:none;overflow:hidden}
.sk .nm.s{font-size:16px} .sk .nm.xs{font-size:14px;line-height:1.02}
.sk .lvs{position:absolute;left:206px;top:0;height:67px;display:flex;flex-direction:column;justify-content:center;gap:0;pointer-events:none}
.sk .lvs i{display:block;width:15px;height:18px;margin:-1px 0;background:var(--t-lvl-off) center/contain no-repeat}
.sk .lvs i.on{background:var(--c);-webkit-mask:var(--t-lvl-lit) center/contain no-repeat;mask:var(--t-lvl-lit) center/contain no-repeat;filter:brightness(1.35) drop-shadow(0 0 3px var(--c))}
.sk .ck{position:absolute;left:180px;top:32px;width:48px;height:48px;background:var(--t-check) center/contain no-repeat;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}
.sk .pad{position:absolute;left:24px;top:38px;width:24px;height:30px;background:var(--t-padlock) center/contain no-repeat;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}
.sk .rq{position:absolute;left:44px;top:47px;min-width:22px;height:18px;padding:0 4px;border-radius:9px;background:#0b0c10e6;border:1px solid #6d6a62;font:12px/16px var(--gfont);text-align:center;color:#e9e1cf;pointer-events:none}
.sk .chn{position:absolute;left:4px;top:-3px;width:135px;height:72px;background:var(--t-chains) center/contain no-repeat;pointer-events:none;opacity:.95}
.sk .au{position:absolute;left:84px;top:-6px;width:26px;height:26px;background:var(--t-auto) center/contain no-repeat;pointer-events:none;filter:drop-shadow(0 1px 2px #000)}
.sk .gt{position:absolute;left:24px;top:-8px;padding:0 5px;height:18px;border-radius:2px;background:#3a1512e6;border:1px solid #a14b3c;font:700 11px/16px var(--body);color:#f3c5b5;pointer-events:none}
.sk.lock .pl,.sk.lock .ic{filter:brightness(.8) saturate(.85)}
.sk.norank .ic,.sk.excl .ic{filter:grayscale(1) brightness(.6)}
.sk.norank .nm,.sk.excl .nm{color:#a9a49a}
.sk.avail:hover .ic,.sk.taken:hover .ic{filter:drop-shadow(0 0 6px var(--c)) brightness(1.08)}
.sk.sel .pl{filter:brightness(1.18) drop-shadow(0 0 5px #fff6)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
/* tooltip como el del juego (tooltip_frame.png) */
.gtt{position:fixed;z-index:50;width:min(440px,calc(100vw - 16px));pointer-events:none;color:#ece6d6;font:15px/1.3 var(--gfont);
  border:12px solid transparent;border-image:var(--t-tt) 12 fill / 12px stretch;padding:4px 6px 10px;box-shadow:0 8px 30px #000c}
.gtt::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-6px;height:46px;background:radial-gradient(ellipse 70% 100% at 50% 100%,#1f6b9a66,transparent 75%);pointer-events:none}
.gtt h4{margin:0 0 2px;font:700 19px/1.2 var(--gfont);text-align:center;color:#fff}
.gtt .sub{text-align:center;font-size:12px;color:#b9ad95;margin-bottom:6px}
.gtt .fl{font-style:italic;color:#cfc8b8;margin:0 0 8px}
.gtt .ef{display:flex;gap:7px;align-items:flex-start;margin:4px 0;color:#8ee04f}
.gtt .ef.bad{color:#ef6b5d}
.gtt .ef img,.gtt .ef .dot{flex:none;width:20px;height:20px;margin-top:1px}
.gtt .ef .dot{display:grid;place-items:center} .gtt .ef .dot::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:currentColor}
.gtt .ef .scope{color:#a8c99a;font-size:13px}
.gtt .rq{margin:6px 0 0;font-size:14px}
.gtt .rq .ok{color:#8ee04f} .gtt .rq .no{color:#ef6b5d} .gtt .rq .muted{color:#b9ad95}
.gtt .ut{margin:8px 0 4px;color:#ece6d6}
.gtt .uc{display:flex;flex-wrap:wrap;gap:4px}
.gtt .uc .uthumb{width:40px;height:87px;margin:0;border:1px solid #555;border-radius:1px}
.gtt .more{font-size:13px;color:#b9ad95;align-self:center}
.gtt .hint{margin-top:8px;font:12px var(--body);color:#8a8272;text-align:center}
.dico{flex:none;width:58px;height:58px;position:relative}
.dico img{width:58px;height:58px;filter:drop-shadow(0 2px 3px #000a)}

.detail{padding:14px;display:grid;gap:10px}
.detail .hd{display:flex;gap:10px;align-items:center}
.detail .hd .ico{width:52px;height:52px;flex:none}
.detail .hd .ico svg{width:30px;height:30px}
.lvls{display:grid;gap:6px}
.lv{border:1px solid var(--line);border-radius:2px;padding:6px 8px;background:#0d0b0988}
.lv.cur{border-color:var(--gold);background:#2a2116}
.lv .h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.req{font-size:13px;display:grid;gap:3px}
.req .ok{color:var(--good)} .req .no{color:var(--bad)}
.units{font-size:13px;color:var(--text)}
.units b{color:var(--gold)}
.abil{border-left:2px solid var(--gold);padding:4px 8px;font-size:13px;background:#0d0b0966}
.abil .an{font-family:var(--display);color:var(--gold2);font-size:15px}
.spell{border:1px solid var(--gold);border-radius:3px;background:linear-gradient(180deg,#2a2116,#14100c);padding:10px;display:grid;gap:8px}
.spell.ov{border-color:#7d6bd1;background:linear-gradient(180deg,#221d33,#100d18)}
.spell .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.spell .sn{font:17px var(--display);color:var(--gold2)}
.spell.ov .sn{color:#cfc4ff}
.spell .sty{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.aty{width:18px;height:18px;vertical-align:-4px;margin-right:4px}

function treeFor(agentKey, fi) {

// ---------- hoja del personaje en vivo ----------
// Estadísticas base de su unidad (o de la montura elegida en el árbol) más los efectos que el juego aplica al propio
// personaje: habilidades con puntos, rasgo del señor, innatas, rasgo de reclutamiento y efectos de facción sobre los
// personajes. Qué estadística cambia cada efecto viene de su bonus_value_id (D.effects[i].sm, stats_personaje.py);
// las mejoras al ejército, los objetos y la veteranía no se suman.
const MNT = window.WH3MNT || {s: {}, u: {}};
const SELF_SC = /^(character_to_character_own(_armytext|_factionwide|_unseen)?|faction_to_character_own(_unseen|_factionwide_armytext)?)$/;
function selfScope(sc, a) {
  return SELF_SC.test(sc) || (sc === "character_to_character_own_spellcaster_text" && a.caster) ||
    (/^faction_to_character_own(_unseen)?_lords_only$/.test(sc) && a.t === "general") || (sc === "faction_to_character_own_agents" && a.t !== "general");
}
function liveStats() {

  let mount = null;
  t.vis.forEach((n, j) => {
    const l = S.lv[j] || 0; if (!l) return;
    const s = SK(n.s), mk = MNT.s[D.skill_keys[n.s]];

    for (const [st, mode, us] of e.sm) {
      if (us >= 0 && !(D.smu[us] || []).includes(unit)) continue;
      if (mode === "on") { if (v > 0) on[st] = 1; }
      else (mode === "p" ? pct : add)[st] = ((mode === "p" ? pct : add)[st] || 0) + v;
      (why[st] = why[st] || []).push(mode === "on" ? label : `${label} ${v > 0 ? "+" : ""}${fmtNum(v)}${mode === "p" ? "%" : ""}`);
    }
  }
  const r = base.rng || null;
  const calc = (st, b) => b == null ? null : st === "rl" ? +(b * (1 - (pct[st] || 0) / 100)).toFixed(1) : Math.round((b + (add[st] || 0)) * (1 + (pct[st] || 0) / 100));
  const v = {};
  for (const st of ["hp", "arm", "ld", "sp", "ma", "md", "ch", "wb", "wap", "bvl", "bvi", "sh"]) v[st] = [base[st] || 0, calc(st, base[st] || 0)];
  v.ws = [base.wb + base.wap, v.wb[1] + v.wap[1]];
  if (r) { v.rng = [r.r, calc("rng", r.r)]; v.rb = [r.b, calc("rb", r.b)]; v.rap = [r.ap, calc("rap", r.ap)]; v.am = [r.am, calc("am", r.am)]; if (r.rl) v.rl = [r.rl, calc("rl", r.rl)]; }

  for (const k of ["salvaguarda", "fisico", "proyectiles", "magia", "fuego"]) {
    const b0 = (base.res || {})[k] || 0, b1 = Math.min(90, b0 + (add[k] || 0));

    rmag: r && [r.mag, r.mag || on.mag], rfire: r && [r.fire, r.fire || on.fire]};
}
const RES_LBL = {salvaguarda: "Salvaguarda", fisico: "Res. física", proyectiles: "Res. proyectiles", magia: "Res. mágica", fuego: "Res. fuego"};
function renderLiveStats() {

    <div class="lsg">

      ${row("ma", "Ataque c/c", V.ma)}${row("md", "Defensa c/c", V.md)}${row("ch", "Carga", V.ch)}
      ${row("ws", "Fuerza arma", V.ws, "", false, ` <small class="brk">${loc(V.wb[1])} + ${loc(V.wap[1])} AP</small>`)}
      ${V.bvl[0] || V.bvl[1] ? row("bvl", "Bonus vs grandes", V.bvl) : ""}${V.bvi[0] || V.bvi[1] ? row("bvi", "Bonus vs inf.", V.bvi) : ""}${V.sh[0] || V.sh[1] ? row("sh", "Escudo", V.sh, "%") : ""}
      ${V.rng ? row("rng", "Alcance", V.rng) + row("rb", "Daño proyectil", [V.rb[0] + V.rap[0], V.rb[1] + V.rap[1]], "", false, ` <small class="brk">${loc(V.rb[1])} + ${loc(V.rap[1])} AP</small>`) + row("am", "Munición", V.am) + (V.rl ? row("rl", "Tiempo de recarga", V.rl, " s", true) : "") : ""}

    <p class="muted lsn">Tamaño Ultra. Suma lo que mejora al propio personaje (habilidades, rasgos y efectos); no cuenta objetos, veteranía ni mejoras al ejército. Pasa el ratón por una cifra para ver de dónde sale.</p>`;

  });
  box.addEventListener("mousedown", e => { const b = e.target.closest("[data-g]"); if (b) { e.preventDefault(); pick(+b.dataset.g); } });
  q.addEventListener("blur", () => setTimeout(close, 120));
  document.addEventListener("keydown", e => { if (e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });
})();

renderFactions();
// Las imágenes de cada subcultura (img/<subcultura>.js) se piden al abrir una de sus facciones; mientras llegan se ve
// la pantalla de carga.
const splash = on => $("#splash").classList.toggle("done", !on);
for (const name of ["openFaction", "openTree", "openArmy"]) {
  const open = window[name];
  window[name] = (fi, ...rest) => {
    const sc = D.factions[fi] && D.factions[fi].sc;
    if (WH3HAS(sc)) return Promise.resolve(open(fi, ...rest));
    splash(true);
    return WH3NEED(sc).then(() => { splash(false); thumbByName = null; return open(fi, ...rest); });  // thumbByName: caché de ejercito.js
  };
}
const startHash = decodeURIComponent((location.hash || "").slice(1));
const startFac = D.factions.find(f => startHash.includes("." + f.k + "."));
WH3NEED(startFac && startFac.sc).then(() => {
  if (!fromToken(startHash) && !armyFromToken(startHash)) show("v-fac");
  splash(false);
});
</script>
